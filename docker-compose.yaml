services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_PASSWORD: admin_dev
      POSTGRES_DB: flashsale
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flashsale"]
      interval: 2s
      retries: 15
  
  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://postgres:admin_dev@postgres:5432/flashsale?sslmode=disable", "up"]
    restart: "no"
  
  auditor:
    build: ./auditor
    environment:
      AUDITOR_DSN: postgres://auditor:auditor_dev@postgres:5432/flashsale
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["9100:9100"]
  
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgres://monitor:monitor_dev@postgres:5432/flashsale?sslmode=disable
    depends_on:
      migrate: {condition: service_completed_successfully}

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  grafana-data:
